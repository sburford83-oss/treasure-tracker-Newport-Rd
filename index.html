<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root { --bg: #0a0a0a; --card: #161616; --gold: #d4af37; --text: #ffffff; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; }
  
  /* Modern Glassmorphism Cards */
  .card { background: var(--card); border-radius: 20px; padding: 20px; margin: 15px; border: 1px solid #333; }
  
  /* High-Impact Treasure Button */
  .treasure-action {
    width: 100%; height: 160px; border-radius: 30px;
    background: linear-gradient(135deg, #1f1a0a, #4a3d16);
    border: 1px solid var(--gold); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
  }
  
  /* Leaderboard Styling */
  .rank-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; }
</style>
</head>
<body>

<div class="app">
  <!-- Staff Interaction Area -->
  <div class="card">
    <button class="treasure-action" onclick="addTreasure()">
      <div style="font-size: 40px;">💎</div>
      <b style="font-size: 20px;">FOUND TREASURE</b>
    </button>
  </div>

  <!-- Real-time Stats -->
  <div class="card">
    <div style="color: var(--gold); font-size: 12px; text-transform: uppercase;">Store Progress</div>
    <h2 id="todayTotal" style="font-size: 48px; margin: 5px 0;">0 / 15</h2>
  </div>

  <!-- Manager Weekly Leaderboard -->
  <section class="card" id="managerPage">
    <div style="margin-bottom: 15px; font-weight: bold;">Weekly Top Recruiters</div>
    <div id="weeklyLeaderboard"></div>
  </section>
</div>
</body>
</html>
