<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treasure">
<title>Valegate Treasure Tracker</title>
<!-- Include your CSS here, ensuring the .manager-page, .manager-action-grid, and .row classes are defined as previously established -->
</head>
<body>

<section class="page manager-page" id="managerPage" style="display:none">
  <!-- Weekly Top Recruiters Leaderboard -->
  <section class="card">
    <div class="leader-head"><div class="eyebrow">Weekly Top Recruiters</div><div>🏆</div></div>
    <div id="weeklyLeaderboard"></div>
  </section>

  <!-- Manager Quick-Actions -->
  <section class="card">
    <div class="leader-head"><div class="eyebrow">Manager Quick-Actions</div><div>⚡</div></div>
    <div class="manager-action-grid">
      <button class="manager-action primary" onclick="copySummary()">Copy Daily Summary</button>
      <button class="manager-action danger" onclick="deleteLastTreasure()">Delete Last Entry</button>
      <button class="manager-action" onclick="resetWeekly()">Reset Weekly Totals<span>Clears only previous days in this week.</span></button>
      <button class="manager-action" onclick="resetToday()">Reset Today<span>Clears only today’s Treasure entries.</span></button>
    </div>
  </section>
</section>

<script>
// Add this logic to your existing render function
if (document.getElementById("weeklyLeaderboard")) {
  const wList = Object.entries(weekCounts()).sort((a, b) => b[1] - a[1]);
  const lb = document.getElementById("weeklyLeaderboard");
  lb.innerHTML = "";
  
  if (wList.length === 0) {
    lb.innerHTML = "<p style='color:#7b684f; text-align:center;'>No data yet this week.</p>";
  } else {
    wList.slice(0, 3).forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<div class="medal">${index + 1}</div><div>${item[0]}</div><div class="score">${item[1]}</div>`;
      lb.appendChild(row);
    });
  }
}

// Add this function to your script section
window.resetWeekly = function() {
  const pin = prompt("Enter reset code:");
  if (pin !== RESET_PIN) {
    alert("Incorrect reset code.");
    return;
  }
  if (confirm("This will clear all entries from this week (except today). Continue?")) {
    const toRemove = entries.filter(e => e.week === thisWeekKey() && e.date !== todayKey());
    Promise.all(toRemove.map(e => remove(ref(db, "stores/valegate/entries/" + e.id))))
      .then(() => alert("Weekly totals reset (today's entries kept)."))
      .catch(err => alert("Error resetting weekly: " + err.message));
  }
};
</script>
</body>
</html>
